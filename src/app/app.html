<nav class="styles-navbar-pro">
  <div class="nav-container">
    <div class="nav-brand" routerLink="/" style="cursor: pointer;">VINTAGE®VIBES</div>

    <div class="nav-right-section">
      <div class="nav-search-container">
        <input
          type="text"
          class="nav-search-input"
          placeholder="BUSCAR..."
          #searchInput
          (input)="onSearch(searchInput.value)">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>

      @if (!authService.user()) {
        <div class="nav-login-icon" routerLink="/login" style="cursor: pointer;">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
      } @else {
        <div class="user-menu-wrapper">
          <div class="nav-login-icon active-user" (click)="toggleUserMenu()" style="cursor: pointer;">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>

          @if (isUserMenuOpen) {
            <div class="user-dropdown">
              <div class="dropdown-user-info">
                <span>Hola, {{ authService.user().username }}</span>
              </div>
              <div class="dropdown-divider"></div>
              <button class="logout-btn" (click)="logout()">Log Out</button>
            </div>
          }
        </div>
      }

      <div class="nav-cart-info" (click)="toggleCart()" style="pointer-events: auto; cursor: pointer;">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="40" viewBox="1 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="cart-icon">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span class="cart-count">({{ cartService.totalItems() }})</span>
      </div>
    </div>
  </div>
</nav>

<router-outlet></router-outlet>

<!-- CARRITO: Aseguramos que escuche 'closeCart' y ejecute 'closeCart()' del padre -->
<aside class="cart-sidebar" [class.open]="isCartOpen">
    <app-carrito (closeCart)="closeCart()"></app-carrito>
</aside>

@if (isCartOpen) {
  <div class="cart-overlay" (click)="closeCart()"></div>
}

<footer class="nude-footer">
  <h1 class="footer-massive-logo">VINTAGE®VIBES</h1>
</footer>
